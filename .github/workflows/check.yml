# The gates, on every push to master and every pull request — the same scripts a developer runs locally.
name: check
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      # a missing gate must fail, not skip
      - name: scripts exist
        run: |
          for s in typecheck lint format:check test build links; do
            node -e "const s=require('./package.json').scripts||{}; if(!s['$s']){console.error('missing script: $s'); process.exit(1)}"
          done

      - run: yarn typecheck
      - run: yarn test
      - run: yarn build # includes fix-nested-urls, which fails on a ref that resolves nowhere
      - run: yarn links # missing targets, unlabeled controls, canvas names out of step with <title>
