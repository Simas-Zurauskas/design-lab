<!-- wf toggle-row — a setting switched in place: the whole row is the control (button aria-pressed, a dotted hotspot),
     the switch on the right. Locals: label, sub (opt.), on (opt.). -->
<button type="button" aria-pressed="{{ this.on ? 'true' : 'false' }}" class="flex min-h-15 w-full items-center gap-3 py-2 text-left">
  <span class="min-w-0 flex-1"><span class="block text-[17px]/[22px] font-semibold">{{ this.label || '' }}</span><if condition="this.sub"><span class="block text-[15px]/5 text-gray-600">{{ this.sub ?? '' }}</span></if></span>
  <span class="wf-switch" aria-hidden="true"></span>
</button>
