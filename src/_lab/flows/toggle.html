<!-- LAB CHROME — flows: the Off / Hover / Always switch for flow lines on the canvas. Goes in the header of a
     section with screens; flows/flows.js (loaded by canvas/canvas.html) drives it through Lab.toggle. -->
<div class="lab-seg-field" title="Lines from each link to the screen it opens — point at a link to single out its line">
  <span class="lab-seg-label">Flows</span>
  <div data-lab-toggle="flows" class="lab-seg" role="group" aria-label="Flows">
    <button type="button" data-mode="off">Off</button>
    <button type="button" data-mode="hover">Hover</button>
    <button type="button" data-mode="always">Always</button>
  </div>
</div>
