<!-- LAB CHROME — toc: the Off / On switch for the groups list in the canvas's top-left corner. In every section
     header through shell/controls.html; toc/toc.js (loaded by canvas/canvas.html) drives it through Lab.toggle.
     Hidden while the canvas has no group (toc.css). -->
<div class="lab-seg-field lab-toc-field" title="The canvas's groups, listed in its top-left corner — click a name to zoom to that group">
  <span class="lab-seg-label">Groups</span>
  <div data-lab-toggle="toc" class="lab-seg" role="group" aria-label="Groups list">
    <button type="button" data-mode="off">Off</button>
    <button type="button" data-mode="on">On</button>
  </div>
</div>
