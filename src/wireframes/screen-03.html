<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Discover</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="discover" class="bg-gray-100 font-sans text-gray-900 antialiased">
  <div class="mx-auto flex h-dvh w-full max-w-[390px] flex-col border-x border-gray-300 bg-white">
    <include src="components/status-bar.html"></include>

    <header class="flex items-center justify-between px-5 pt-2 pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="flame" class="h-6 w-6"></i>
        <span class="text-lg font-bold">Discover</span>
      </div>
      <a href="screen-10.html" aria-label="Filters" class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-500">
        <i data-lucide="sliders-horizontal" class="h-4 w-4"></i>
      </a>
    </header>

    <main class="flex min-h-0 flex-1 flex-col gap-4 px-4 pb-4">
      <div class="relative flex min-h-0 flex-1 flex-col overflow-hidden rounded-3xl border border-gray-300">
        <div class="absolute inset-x-0 top-0 z-10 flex gap-1.5 p-3">
          <span class="h-1 flex-1 rounded-full bg-gray-900"></span>
          <span class="h-1 flex-1 rounded-full bg-gray-300"></span>
          <span class="h-1 flex-1 rounded-full bg-gray-300"></span>
          <span class="h-1 flex-1 rounded-full bg-gray-300"></span>
        </div>
        <div class="wf-img min-h-0 flex-1">PHOTO</div>
        <div class="border-t border-gray-200 bg-white p-4">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-xl font-bold">Bella, 7</p>
              <p class="mt-0.5 flex items-center gap-1 text-sm text-gray-500">
                <i data-lucide="map-pin" class="h-3.5 w-3.5"></i>2 km away
              </p>
            </div>
            <a href="screen-04.html" aria-label="Horse details" class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-500">
              <i data-lucide="info" class="h-4 w-4"></i>
            </a>
          </div>
          <div class="mt-3 flex flex-wrap gap-1.5">
            <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">Hanoverian</span>
            <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">Mare</span>
            <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">16.1 hh</span>
            <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">Dressage</span>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-center gap-5">
        <button aria-label="Pass" class="flex h-14 w-14 items-center justify-center rounded-full border-2 border-gray-300 text-gray-500">
          <i data-lucide="x" class="h-6 w-6"></i>
        </button>
        <button aria-label="Super Like" class="flex h-11 w-11 items-center justify-center rounded-full border border-gray-300 text-gray-500">
          <i data-lucide="star" class="h-5 w-5"></i>
        </button>
        <a href="screen-05.html" aria-label="Like" class="flex h-14 w-14 items-center justify-center rounded-full bg-gray-900 text-white">
          <i data-lucide="heart" class="h-6 w-6"></i>
        </a>
      </div>
    </main>

    <include src="components/wf-tabbar.html"></include>
  </div>
  <include src="_lab/screen/chrome.html"></include>
</body>
</html>
