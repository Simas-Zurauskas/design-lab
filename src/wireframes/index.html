<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireframes — Design Lab</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-section="wireframes" class="lab-page">
  <div class="lab-shell">
    <include src="_lab/shell/sidebar.html"></include>
    <main class="lab-main">
      <header class="lab-header">
        <div>
          <h1>Wireframes</h1>
        </div>
        <include src="_lab/shell/controls.html"></include>
      </header>

      <!-- LAB CHROME canvas: [data-canvas], [data-canvas-world] and every lab-* class are workbench
           components (_lab/canvas/). The CONTENT here is only the arrangement — groups (a journey
           each) → rows → screens. Add a screen = add a figure.lab-screen to a row. -->
      <div data-canvas class="lab-canvas" role="region" aria-label="Wireframes canvas">
        <div data-canvas-world class="lab-canvas-world">
          <div class="lab-row">
            <section class="lab-group">
              <h2 class="lab-group-title">Sample flow</h2>
              <div class="lab-row">
                <figure class="lab-screen">
                  <figcaption><a href="screen-01.html">01 · Home</a><button data-reset class="lab-btn" title="Reset this screen">↺</button></figcaption>
                  <div class="phone-frame"><iframe src="screen-01.html" title="Home" class="phone-screen"></iframe></div>
                </figure>
                <figure class="lab-screen">
                  <figcaption><a href="screen-02.html">02 · Item</a><button data-reset class="lab-btn" title="Reset this screen">↺</button></figcaption>
                  <div class="phone-frame"><iframe src="screen-02.html" title="Item" class="phone-screen"></iframe></div>
                </figure>
                <figure class="lab-screen">
                  <figcaption><a href="screen-03.html">03 · Done</a><button data-reset class="lab-btn" title="Reset this screen">↺</button></figcaption>
                  <div class="phone-frame"><iframe src="screen-03.html" title="Done" class="phone-screen"></iframe></div>
                </figure>
              </div>
            </section>
          </div>
        </div>
        <include src="_lab/canvas/canvas.html"></include>
      </div>
    </main>
  </div>
</body>
</html>
