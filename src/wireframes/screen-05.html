<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="match" class="bg-gray-100 font-sans text-gray-900 antialiased">

    <include src="components/status-bar.html"></include>

    <main class="flex flex-1 flex-col px-6 pb-8">

      </div>

      <div class="flex flex-col gap-3">
        <a href="screen-07.html" class="rounded-full bg-gray-900 py-3.5 text-center font-semibold text-white">Send a message</a>
