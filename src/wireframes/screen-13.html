<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13 · Plan a meet-up</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="meetup" class="bg-gray-100 font-sans text-gray-900 antialiased">
  <div class="mx-auto flex h-dvh w-full max-w-[390px] flex-col border-x border-gray-300 bg-white">
    <include src="components/status-bar.html"></include>

    <header class="flex items-center gap-3 px-5 pt-2 pb-3">
      <a href="screen-07.html" aria-label="Back" class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-500">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </a>
      <h1 class="text-lg font-bold">Plan a meet-up</h1>
      <div class="ml-auto flex">
        <div class="wf-img h-8 w-8 rounded-full"></div>
        <div class="wf-img -ml-2.5 h-8 w-8 rounded-full"></div>
      </div>
    </header>

    <main class="flex min-h-0 flex-1 flex-col gap-6 overflow-y-auto px-5 pb-6">
      <section class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold">September 2026</h2>
          <div class="flex gap-1">
            <button aria-label="Previous month" class="flex h-8 w-8 items-center justify-center rounded-full text-gray-300"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
            <button aria-label="Next month" class="flex h-8 w-8 items-center justify-center rounded-full border border-gray-300 text-gray-500"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
          </div>
        </div>
        <div role="radiogroup" aria-label="Day" class="grid grid-cols-7 text-center text-sm">
          <span class="py-2 text-xs font-medium text-gray-400">M</span><span class="py-2 text-xs font-medium text-gray-400">T</span><span class="py-2 text-xs font-medium text-gray-400">W</span><span class="py-2 text-xs font-medium text-gray-400">T</span><span class="py-2 text-xs font-medium text-gray-400">F</span><span class="py-2 text-xs font-medium text-gray-400">S</span><span class="py-2 text-xs font-medium text-gray-400">S</span>
          <span></span><span class="py-2.5 text-gray-300">1</span><span class="py-2.5 text-gray-300">2</span><span class="py-2.5 text-gray-300">3</span><span class="py-2.5 text-gray-300">4</span><span class="py-2.5 text-gray-300">5</span><span class="py-2.5 text-gray-300">6</span>
          <span class="py-2.5 text-gray-300">7</span><span class="py-2.5 text-gray-300">8</span><span class="py-2.5 text-gray-300">9</span><span class="py-2.5 text-gray-300">10</span><span class="py-2.5 text-gray-300">11</span><span class="py-2.5 text-gray-300">12</span><span class="py-2.5 text-gray-300">13</span>
          <span class="py-2.5 text-gray-300">14</span><span class="py-2.5 text-gray-300">15</span><span class="py-2.5 text-gray-300">16</span><span class="py-2.5 text-gray-300">17</span><span class="py-2.5 text-gray-300">18</span><span class="py-2.5 text-gray-300">19</span><span class="py-2.5 text-gray-300">20</span>
          <span class="py-2.5 text-gray-300">21</span><span class="py-2.5 text-gray-300">22</span><span class="py-2.5 text-gray-300">23</span><button type="button" role="radio" aria-checked="false" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white font-bold underline underline-offset-4 aria-checked:no-underline">24</button><button type="button" role="radio" aria-checked="false" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white">25</button><button type="button" role="radio" aria-checked="true" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white">26</button><button type="button" role="radio" aria-checked="false" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white">27</button>
          <button type="button" role="radio" aria-checked="false" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white">28</button><button type="button" role="radio" aria-checked="false" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white">29</button><button type="button" role="radio" aria-checked="false" class="mx-auto flex h-10 w-10 items-center justify-center rounded-full aria-checked:bg-gray-900 aria-checked:font-semibold aria-checked:text-white">30</button>
        </div>
      </section>

      <section class="flex flex-col gap-2">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Time</h2>
        <div role="radiogroup" aria-label="Time" class="grid grid-cols-4 gap-2">
          <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 py-2 text-center text-sm aria-checked:border-gray-900 aria-checked:bg-gray-900 aria-checked:text-white">8:00</button>
          <button type="button" role="radio" aria-checked="true" class="rounded-full border border-gray-300 py-2 text-center text-sm aria-checked:border-gray-900 aria-checked:bg-gray-900 aria-checked:text-white">9:00</button>
          <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 py-2 text-center text-sm aria-checked:border-gray-900 aria-checked:bg-gray-900 aria-checked:text-white">10:00</button>
          <span class="rounded-full border border-gray-200 py-2 text-center text-sm text-gray-300 line-through">11:00</span>
          <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 py-2 text-center text-sm aria-checked:border-gray-900 aria-checked:bg-gray-900 aria-checked:text-white">13:00</button>
          <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 py-2 text-center text-sm aria-checked:border-gray-900 aria-checked:bg-gray-900 aria-checked:text-white">14:00</button>
          <span class="rounded-full border border-gray-200 py-2 text-center text-sm text-gray-300 line-through">15:00</span>
          <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 py-2 text-center text-sm aria-checked:border-gray-900 aria-checked:bg-gray-900 aria-checked:text-white">16:00</button>
        </div>
      </section>

      <section class="flex flex-col gap-2">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Where</h2>
        <div role="radiogroup" aria-label="Where" class="divide-y divide-gray-200 rounded-xl border border-gray-200">
          <button type="button" role="radio" aria-checked="true" class="group flex w-full items-center gap-3 px-4 py-3 text-left">
            <i data-lucide="house" class="h-4 w-4 text-gray-400"></i>
            <span class="flex flex-1 flex-col gap-1.5">
              <span class="text-sm">Your stable</span>
              <span class="wf-line block w-32"></span>
            </span>
            <span class="flex h-5 w-5 items-center justify-center rounded-full border-2 border-gray-300 group-aria-checked:border-gray-900"><span class="hidden h-2.5 w-2.5 rounded-full bg-gray-900 group-aria-checked:block"></span></span>
          </button>
          <button type="button" role="radio" aria-checked="false" class="group flex w-full items-center gap-3 px-4 py-3 text-left">
            <i data-lucide="house" class="h-4 w-4 text-gray-400"></i>
            <span class="flex flex-1 flex-col gap-1.5">
              <span class="text-sm">Their stable</span>
              <span class="wf-line block w-28"></span>
            </span>
            <span class="flex h-5 w-5 items-center justify-center rounded-full border-2 border-gray-300 group-aria-checked:border-gray-900"><span class="hidden h-2.5 w-2.5 rounded-full bg-gray-900 group-aria-checked:block"></span></span>
          </button>
          <a href="#" class="flex items-center gap-3 px-4 py-3">
            <i data-lucide="map-pin" class="h-4 w-4 text-gray-400"></i>
            <span class="flex-1 text-sm">Somewhere else</span>
            <i data-lucide="chevron-right" class="h-4 w-4 text-gray-400"></i>
          </a>
        </div>
      </section>

      <section class="flex flex-col gap-2">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Note</h2>
        <div class="min-h-20 rounded-xl border border-gray-300 px-4 py-3.5">
          <span class="text-sm text-gray-400">Add a note (optional)…</span>
        </div>
      </section>
    </main>

    <footer class="border-t border-gray-200 px-5 pt-3 pb-6">
      <a href="screen-07.html" class="block rounded-full bg-gray-900 py-3.5 text-center font-semibold text-white">Send invite</a>
    </footer>
  </div>
  <include src="_lab/screen/chrome.html"></include>
</body>
</html>
