<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 · Chat</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="chat" class="bg-gray-100 font-sans text-gray-900 antialiased">
  <div class="mx-auto flex h-dvh w-full max-w-[390px] flex-col border-x border-gray-300 bg-white">
    <include src="components/status-bar.html"></include>

    <header class="flex items-center gap-3 border-b border-gray-200 px-4 pt-2 pb-3">
      <a href="screen-06.html" aria-label="Back" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-gray-300 text-gray-500">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </a>
      <div class="wf-img h-9 w-9 shrink-0 rounded-full"></div>
      <div class="flex flex-1 flex-col gap-1.5">
        <div class="wf-line w-24"></div>
        <div class="wf-line w-14"></div>
      </div>
      <a href="screen-13.html" aria-label="Plan a meet-up" class="flex h-9 w-9 shrink-0 items-center justify-center text-gray-500"><i data-lucide="calendar-plus" class="h-5 w-5"></i></a>
      <button aria-label="Safety" class="flex h-9 w-9 shrink-0 items-center justify-center text-gray-400"><i data-lucide="shield" class="h-5 w-5"></i></button>
    </header>

    <main class="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto px-4 py-4">
      <p class="text-center text-xs text-gray-400">You matched 2 days ago</p>
      <div class="max-w-[75%] self-start rounded-2xl rounded-bl-md bg-gray-100 px-4 py-2.5 text-sm">Hey! Bella looks lovely — is she good with other horses?</div>
      <div class="max-w-[75%] self-end rounded-2xl rounded-br-md bg-gray-900 px-4 py-2.5 text-sm text-white">She is! Very social in the paddock.</div>
      <div class="max-w-[75%] self-end rounded-2xl rounded-br-md bg-gray-900 px-4 py-2.5 text-sm text-white">Would you like to arrange a meet-up at our stable?</div>
      <p class="text-center text-xs text-gray-400">Today, 9:12</p>
      <div class="max-w-[75%] self-start rounded-2xl rounded-bl-md bg-gray-100 px-4 py-2.5 text-sm">That would be great. Saturday morning?</div>
      <div class="max-w-[75%] self-start rounded-2xl rounded-bl-md bg-gray-100 px-4 py-2.5 text-sm">I can bring Storm's vet records too.</div>
    </main>

    <footer class="flex items-center gap-2 border-t border-gray-200 px-4 pt-3 pb-5">
      <div class="flex flex-1 items-center rounded-full border border-gray-300 px-4 py-3">
        <span class="text-sm text-gray-400">Message…</span>
      </div>
      <button aria-label="Send" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-gray-900 text-white">
        <i data-lucide="send" class="h-5 w-5"></i>
      </button>
    </footer>
  </div>
  <include src="_lab/screen/chrome.html"></include>
</body>
</html>
