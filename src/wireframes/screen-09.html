<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>09 · Sign in</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="signin" class="bg-gray-100 font-sans text-gray-900 antialiased">
  <div class="mx-auto flex min-h-dvh w-full max-w-[390px] flex-col border-x border-gray-300 bg-white">
    <include src="components/status-bar.html"></include>

    <header class="px-5 pt-2 pb-3">
      <a href="screen-01.html" aria-label="Back" class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-500">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </a>
    </header>

    <main class="flex flex-1 flex-col px-6 pb-8">
      <div class="flex flex-col gap-3 pt-4">
        <h1 class="text-3xl font-bold">Welcome back</h1>
        <div class="wf-line w-2/3"></div>
      </div>

      <div class="mt-8 flex flex-col gap-4">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium">Email</span>
          <div class="flex items-center gap-3 rounded-xl border border-gray-300 px-4 py-3.5">
            <i data-lucide="mail" class="h-4 w-4 text-gray-400"></i>
            <div class="wf-line w-1/2"></div>
          </div>
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium">Password</span>
          <div class="flex items-center gap-3 rounded-xl border border-gray-300 px-4 py-3.5">
            <i data-lucide="lock" class="h-4 w-4 text-gray-400"></i>
            <span class="flex-1 text-sm leading-none tracking-[0.3em] text-gray-400">••••••••</span>
            <i data-lucide="eye" class="h-4 w-4 text-gray-400"></i>
          </div>
        </label>
        <a href="#" class="self-end text-sm font-medium underline">Forgot password?</a>
        <a href="screen-03.html" class="mt-2 rounded-full bg-gray-900 py-3.5 text-center font-semibold text-white">Sign in</a>
      </div>

      <div class="my-8 flex items-center gap-3 text-xs text-gray-400">
        <span class="h-px flex-1 bg-gray-200"></span>or<span class="h-px flex-1 bg-gray-200"></span>
      </div>

      <div class="flex flex-col gap-3">
        <a href="screen-03.html" class="flex items-center justify-center gap-3 rounded-full border border-gray-300 py-3.5 font-semibold">
          <span class="wf-img h-5 w-5 rounded-full"></span>Continue with Apple
        </a>
        <a href="screen-03.html" class="flex items-center justify-center gap-3 rounded-full border border-gray-300 py-3.5 font-semibold">
          <span class="wf-img h-5 w-5 rounded-full"></span>Continue with Google
        </a>
      </div>

      <p class="mt-auto pt-8 text-center text-sm text-gray-500">
        New here? <a href="screen-02.html" class="font-semibold text-gray-900 underline">Create a profile</a>
      </p>
    </main>
  </div>
  <include src="_lab/screen/chrome.html"></include>
</body>
</html>
