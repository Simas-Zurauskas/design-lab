<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Horse detail</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="detail" class="bg-gray-100 font-sans text-gray-900 antialiased">
  <div class="mx-auto flex min-h-dvh w-full max-w-[390px] flex-col border-x border-gray-300 bg-white">
    <include src="components/status-bar.html"></include>

    <header class="flex items-center gap-3 px-5 pt-2 pb-3">
      <a href="screen-03.html" aria-label="Back" class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-500">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </a>
      <h1 class="text-lg font-bold">Details</h1>
    </header>

    <main class="flex flex-1 flex-col gap-6 pb-8">
      <div class="flex gap-2 overflow-x-auto px-5">
        <div class="wf-img h-96 w-[80%] shrink-0 rounded-2xl">PHOTO 1</div>
        <div class="wf-img h-96 w-[80%] shrink-0 rounded-2xl">PHOTO 2</div>
        <div class="wf-img h-96 w-[80%] shrink-0 rounded-2xl">PHOTO 3</div>
      </div>

      <section class="flex flex-col gap-3 px-5">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold">Bella, 7</h2>
          <span class="flex items-center gap-1 text-sm text-gray-500">
            <i data-lucide="map-pin" class="h-3.5 w-3.5"></i>2 km away
          </span>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">Hanoverian</span>
          <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">Mare</span>
          <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">16.1 hh</span>
          <span class="rounded-full border border-gray-300 px-2.5 py-1 text-xs">Dressage</span>
        </div>
      </section>

      <section class="flex flex-col gap-2.5 px-5">
        <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500">About</h3>
        <div class="wf-line w-full"></div>
        <div class="wf-line w-full"></div>
        <div class="wf-line w-2/3"></div>
      </section>

      <section class="flex flex-col gap-2 px-5">
        <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Details</h3>
        <dl class="divide-y divide-gray-200 rounded-xl border border-gray-200">
          <div class="flex items-center justify-between px-4 py-3">
            <dt class="text-sm text-gray-500">Discipline</dt>
            <dd class="wf-line w-24"></dd>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <dt class="text-sm text-gray-500">Temperament</dt>
            <dd class="wf-line w-16"></dd>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <dt class="text-sm text-gray-500">Experience</dt>
            <dd class="wf-line w-20"></dd>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <dt class="text-sm text-gray-500">Stable</dt>
            <dd class="wf-line w-28"></dd>
          </div>
        </dl>
      </section>

      <section class="flex flex-col gap-2 px-5">
        <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Owner</h3>
        <a href="#" aria-label="Owner profile" class="flex items-center gap-3 rounded-xl border border-gray-200 px-4 py-3">
          <div class="wf-img h-10 w-10 shrink-0 rounded-full"></div>
          <div class="flex flex-1 flex-col gap-1.5">
            <div class="wf-line w-24"></div>
            <div class="wf-line w-16"></div>
          </div>
          <i data-lucide="chevron-right" class="h-4 w-4 text-gray-400"></i>
        </a>
      </section>

      <div class="mt-2 flex items-center justify-center gap-5 px-5">
        <button aria-label="Pass" class="flex h-14 w-14 items-center justify-center rounded-full border-2 border-gray-300 text-gray-500">
          <i data-lucide="x" class="h-6 w-6"></i>
        </button>
        <a href="screen-05.html" aria-label="Like" class="flex h-14 w-14 items-center justify-center rounded-full bg-gray-900 text-white">
          <i data-lucide="heart" class="h-6 w-6"></i>
        </a>
      </div>
    </main>
  </div>
  <include src="_lab/screen/chrome.html"></include>
</body>
</html>
